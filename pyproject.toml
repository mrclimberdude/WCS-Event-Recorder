[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcs-event-recorder"
version = "0.1.0"
description = "Traceable music tracking for West Coast Swing events"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
wcs-recorder = "wcs_event_recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
