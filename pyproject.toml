[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcs-event-recorder"
version = "0.1.0"
description = "Traceable music tracking for West Coast Swing events"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1", "httpx>=0.28.1,<0.29"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
web = ["fastapi>=0.162,<0.163", "uvicorn>=0.54,<0.55"]
web-test = ["playwright>=1.64,<1.65"]

[project.scripts]
wcs-recorder = "wcs_event_recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wcs_event_recorder = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
